      class="mx-auto grid min-h-[calc(100svh-85px)] max-w-6xl items-center gap-10 px-6 py-12 sm:gap-12 sm:px-8 sm:py-16 lg:grid-cols-2 lg:gap-16 lg:px-12 lg:py-20">
      <form action="#" method="post">
        <div class="form-row">
            <div>
              <h1 class="items-center">Student Result Calculator</h1>
                
                <input type="text" id="Student Name " name="Student Name" placeholder="Student Name" required>
            </div>
            <div>
                
                <input type="Mathematics score" id="Mathematics score" name="Mathematics score" placeholder="Mathematics score"  required>
            </div>
            <div>
                
                <input type="English score" id="English score" name="English score" placeholder="English score" required>
            </div>
            <div>
                
                <input type="Computer Score" id="Computer Score" name="Computer Score" placeholder="Computer Score" required>
            </div>
        </div>
            <button type="submit">Calculate Result</button>
            </form>
    </section>
  </main>
