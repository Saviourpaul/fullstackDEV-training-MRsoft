<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simTest International School | Student Registration</title>
    <link rel="stylesheet" href="asset/css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="Home.html">Home</a></li>
            <li><a href="AboutUs.html">About Us</a></li>
            <li><a href="Courses.html">Courses</a></li>
            <li><a class="active" href="register.html">Register</a></li>
            <li><a href="contactUs.html">Contact</a></li>
        </ul>
    </nav>

    <header>
        <h1>Student Registration Form</h1>
        <p>Complete the form below to begin your admission process at simTest International School.</p>
    </header>

    <main>
        <section class="form-panel">
            <form action="#" method="post">
                <div class="form-row">
                    <div>
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                    </div>
                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                    </div>
                    <div>
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            
                        </select>
                    </div>
                </div>

                <div>
                    <label for="course">Course Selection</label>
                    <select id="course" name="course" required>
                        <option value="">Choose a course</option>
                        <option value="frontend-development">Frontend Development</option>
                        <option value="computer-science">Computer Science Basics</option>
                        <option value="digital-marketing">Digital Marketing</option>
                        <option value="graphics-design">Graphics Design</option>
                        <option value="data-analysis">Data Analysis</option>
                    </select>
                </div>

                <div>
                    <label for="address">Address</label>
                    <textarea id="address" name="address" placeholder="Enter your home address" required></textarea>
                </div>

                <button type="submit">Submit Registration</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 simTest International School. All rights reserved.</p>
    </footer>
</body>
</html>
