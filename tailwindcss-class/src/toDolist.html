<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f5" />
    <meta name="description" content="A simple, focused to-do list that saves your tasks on this device." />
    <title>Today — Daymark</title>
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-[#f5f7f5] font-sans text-slate-900 antialiased selection:bg-emerald-200 selection:text-emerald-950">
    <header class="mx-auto flex max-w-5xl items-center justify-between px-5 py-5 sm:px-8 sm:py-7">
      <a href="#main" class="inline-flex items-center gap-2.5 rounded-md text-sm font-bold tracking-[0.12em] text-slate-800 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-700" aria-label="Daymark home">
        
       
      </a>
      <span class="rounded-full border border-slate-200 bg-white px-3.5 py-2 text-xs font-medium text-slate-600 sm:px-4 sm:text-sm" id="today-date"></span>
    </header>

    <main id="main" class="mx-auto w-full max-w-2xl px-5 pb-12 pt-7 sm:px-8 sm:pt-12">
      <section aria-labelledby="page-title">
        <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
          <div>
            <h1 id="page-title" class="text-4xl font-semibold tracking-tight text-slate-900 sm:text-5xl">Today's tasks</h1>
          </div>
          <div class="flex items-center gap-3 self-start rounded-2xl border border-slate-200/80 bg-white px-4 py-3 shadow-sm shadow-slate-900/[0.02] sm:self-auto">
            <span class="flex size-10 items-center justify-center rounded-xl bg-emerald-50 text-emerald-800" aria-hidden="true">
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
            </span>
            <div>
              <p id="task-count" class="text-lg leading-5 font-semibold tabular-nums text-slate-900">0 tasks</p>
              <p id="progress-caption" class="mt-1 text-xs text-slate-500">Ready when you are</p>
            </div>
          </div>
        </div>
      </section>

      <section class="mt-8 rounded-3xl border border-slate-200/80 bg-white p-4 shadow-sm shadow-slate-900/[0.03] sm:mt-10 sm:p-6" aria-label="Your to-do list">
        <form id="task-form" class="flex flex-col gap-3 sm:flex-row" autocomplete="off">
          <label for="task-input" class="sr-only">Add a task</label>
          <div class="relative min-w-0 flex-1">
            <svg aria-hidden="true" class="pointer-events-none absolute top-1/2 left-4 size-5 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14m-7-7h14" /></svg>
            <input id="task-input" name="task" type="text" maxlength="120" placeholder="What needs to get done?" required
              class="min-h-12 w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pr-4 pl-12 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 hover:border-slate-300 focus:border-emerald-600 focus:bg-white focus:ring-4 focus:ring-emerald-700/10" />
          </div>
          <button type="submit" class="inline-flex min-h-12 items-center justify-center gap-2 rounded-xl bg-emerald-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-emerald-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700 active:translate-y-px sm:px-6">
            <svg aria-hidden="true" class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14m-7-7h14" /></svg>
            Add task
          </button>
        </form>
        <p id="form-message" class="mt-2 hidden px-1 text-xs text-rose-700" role="alert"></p>

        <div class="mt-6 flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4 sm:mt-7">
          <div id="filters" class="flex items-center gap-1" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true" class="filter-button rounded-lg px-3 py-2 text-xs font-semibold transition sm:px-3.5 sm:text-sm">All</button>
            <button type="button" data-filter="active" aria-pressed="false" class="filter-button rounded-lg px-3 py-2 text-xs font-medium transition sm:px-3.5 sm:text-sm">Active</button>
            <button type="button" data-filter="completed" aria-pressed="false" class="filter-button rounded-lg px-3 py-2 text-xs font-medium transition sm:px-3.5 sm:text-sm">Completed</button>
          </div>
          <button id="clear-completed" type="button" class="hidden rounded-md px-2 py-2 text-xs font-medium text-slate-500 transition hover:text-rose-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-700">Clear completed</button>
        </div>

        <ul id="task-list" class="divide-y divide-slate-100" aria-label="Tasks"></ul>
        <div id="empty-state" class="py-12 text-center sm:py-14">
          <span class="mx-auto flex size-12 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700" aria-hidden="true">
            <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
          </span>
          <p id="empty-title" class="mt-4 text-sm font-semibold text-slate-800">A clear start.</p>
          <p id="empty-copy" class="mt-1 text-sm text-slate-500">Add your first task to get going.</p>
        </div>

        <p class="mt-1 flex justify-center pt-3 text-xs text-slate-400" role="status" aria-live="polite">
        </p>

       
      </section>

    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
